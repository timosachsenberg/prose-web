# Checks and builds the site (the ProSE app at /prose-web/, see .github/assemble-site.sh for the
# layout) and deploys it to GitHub Pages from main. The repository's Pages source must be "GitHub
# Actions" (switch it before the first push of the app: the site deployed before stays live until
# this workflow deploys):
#   gh api -X PUT repos/timosachsenberg/prose-web/pages -f build_type=workflow
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a running one is not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # the toolchain of the local builds (Node 24.19.0 with its npm 11.17.0)
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Check the npm version
        run: test "$(npm --version)" = 11.17.0

      - name: Install the app's dependencies
        working-directory: app
        run: npm ci

      - name: Type check
        working-directory: app
        run: npm run check

      - name: Unit tests
        working-directory: app
        run: npx vitest run

      - name: Build the app (base /prose-web/)
        working-directory: app
        run: npm run build

      - name: Assemble the site
        run: .github/assemble-site.sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
